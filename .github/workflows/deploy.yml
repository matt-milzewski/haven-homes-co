name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: haven-homes-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  STACK_NAME: haven-homes-co-site
  CERTIFICATE_REGION: us-east-1
  CERTIFICATE_STACK_NAME: haven-homes-co-certificate
  DOMAIN_NAME: havenhomesco.com.au
  HOSTED_ZONE_ID: Z03798923BM6ZCRP7BI4B

jobs:
  deploy:
    name: Provision and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate GitHub OIDC subject
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          OIDC_JWT="$(jq -r '.value' <<<"$response")" python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["OIDC_JWT"]
          encoded = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(encoded + "=" * (-len(encoded) % 4)))
          expected = "repo:matt-milzewski/haven-homes-co:ref:refs/heads/main"
          actual = claims.get("sub", "")
          print("OIDC subject: " + actual)
          if actual != expected:
              raise SystemExit("Unexpected OIDC subject")
          PY

      - name: Configure AWS credentials with GitHub OIDC
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: haven-site-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure bootstrap AWS credentials
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Provision TLS certificate
        id: certificate
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/certificate.yml \
            --stack-name "$CERTIFICATE_STACK_NAME" \
            --region "$CERTIFICATE_REGION" \
            --parameter-overrides \
              DomainName="$DOMAIN_NAME" \
              HostedZoneId="$HOSTED_ZONE_ID" \
            --no-fail-on-empty-changeset

          certificate_arn="$(aws cloudformation describe-stacks \
            --stack-name "$CERTIFICATE_STACK_NAME" \
            --region "$CERTIFICATE_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" \
            --output text)"
          echo "certificate_arn=$certificate_arn" >> "$GITHUB_OUTPUT"

      - name: Provision hosting and DNS
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              DomainName="$DOMAIN_NAME" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              CertificateArn="${{ steps.certificate.outputs.certificate_arn }}" \
            --no-fail-on-empty-changeset

      - name: Read deployment outputs
        id: outputs
        run: |
          bucket="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)"
          distribution_id="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          domain="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" --output text)"
          site_url="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" --output text)"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        env:
          SITE_URL: ${{ steps.outputs.outputs.site_url }}
          ANCHOR_FORMS_API_BASE: ${{ vars.ANCHOR_FORMS_API_BASE }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          npm run build
          npm run check

      - name: Upload website
        env:
          BUCKET: ${{ steps.outputs.outputs.bucket }}
        run: |
          aws s3 sync _site/ "s3://$BUCKET" \
            --delete \
            --cache-control "public,max-age=86400"
          aws s3 cp _site/ "s3://$BUCKET" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp _site/robots.txt "s3://$BUCKET/robots.txt" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/plain; charset=utf-8"
          aws s3 cp _site/sitemap.xml "s3://$BUCKET/sitemap.xml" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/xml; charset=utf-8"

      - name: Refresh CloudFront
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution_id }}" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.outputs.outputs.distribution_id }}" \
            --id "$invalidation_id"

      - name: Write deployment summary
        run: |
          {
            echo "## Haven Homes Co. deployed"
            echo
            echo "- Website: ${{ steps.outputs.outputs.site_url }}"
            echo "- WWW: https://www.${DOMAIN_NAME} (301 redirect)"
            echo "- CloudFront distribution: \`${{ steps.outputs.outputs.distribution_id }}\`"
            echo "- S3 bucket: \`${{ steps.outputs.outputs.bucket }}\`"
            echo "- TLS certificate: \`${{ steps.certificate.outputs.certificate_arn }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
