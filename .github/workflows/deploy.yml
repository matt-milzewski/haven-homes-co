name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: haven-homes-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  STACK_NAME: haven-homes-co-site

jobs:
  deploy:
    name: Provision and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Provision hosting
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yml \
            --stack-name "$STACK_NAME" \
            --no-fail-on-empty-changeset

      - name: Read deployment outputs
        id: outputs
        run: |
          bucket="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)"
          distribution_id="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          domain="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" --output text)"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "site_url=https://$domain" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        env:
          SITE_URL: ${{ steps.outputs.outputs.site_url }}
          ANCHOR_FORMS_API_BASE: ${{ vars.ANCHOR_FORMS_API_BASE }}
        run: |
          npm run build
          npm run check

      - name: Upload website
        env:
          BUCKET: ${{ steps.outputs.outputs.bucket }}
        run: |
          aws s3 sync _site/ "s3://$BUCKET" \
            --delete \
            --cache-control "public,max-age=86400"
          aws s3 cp _site/ "s3://$BUCKET" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp _site/robots.txt "s3://$BUCKET/robots.txt" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/plain; charset=utf-8"
          aws s3 cp _site/sitemap.xml "s3://$BUCKET/sitemap.xml" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/xml; charset=utf-8"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.distribution_id }}" --paths "/*"

      - name: Write deployment summary
        run: |
          {
            echo "## Haven Homes Co. deployed"
            echo
            echo "- Website: ${{ steps.outputs.outputs.site_url }}"
            echo "- CloudFront distribution: \`${{ steps.outputs.outputs.distribution_id }}\`"
            echo "- S3 bucket: \`${{ steps.outputs.outputs.bucket }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
